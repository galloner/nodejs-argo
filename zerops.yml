zerops:
  - setup: nodejs
    build:
      base: alpine/nodejs@24

      buildCommands:
        - npm install # 如果没有 package-lock.json，可以改成 npm install

      deployFiles:
        - ./

    run:
      base: alpine/nodejs@24

      ports:
        - port: 3000
          httpSupport: true

      start: npm start
